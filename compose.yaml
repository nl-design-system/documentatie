---
version: "3"
services:
  www:
    volumes:
      - ./apps/nldesignsystem.nl/dist:/usr/local/apache2/htdocs/
      - ./apps/nldesignsystem.nl/dist/.htaccess:/usr/local/apache2/htdocs/.htaccess
      - ./httpd.conf:/usr/local/apache2/conf/httpd.conf
    build:
      dockerfile: httpd.Dockerfile
    ports:
      - "8080:80"
